name: Varchaz Daily Morning Nudge Cron

on:
  # Automated schedule disabled per request
  # schedule:
  #   - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  send-morning-nudge:
    name: Generate and Dispatch Morning Performance Nudges
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Execute Morning User Performance Nudge Auto Mailer
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EMAIL_API_URL: ${{ secrets.EMAIL_API_URL || 'https://varchaz-email-api-sigma.vercel.app/send' }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY || 'your_super_secret_api_key_here' }}
        run: node scripts/sendDailyReportCron.cjs --morning
