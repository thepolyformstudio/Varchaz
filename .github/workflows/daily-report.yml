name: Varchaz Daily Product Group MTD MIS Cron

on:
  schedule:
    # 15:30 UTC = 21:00 (9:00 PM) IST every day
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  send-daily-product-group-reports:
    name: Generate and Dispatch 4 Product Group MIS & Active Products Tracker Emails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Execute Daily MIS & Active Products Tracker Auto Mailer
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EMAIL_API_URL: ${{ secrets.EMAIL_API_URL || 'https://varchaz-email-api-sigma.vercel.app/send' }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
        run: node scripts/sendDailyReportCron.cjs --daily-groups


