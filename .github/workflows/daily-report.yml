name: Varchaz Weekly MTD Auto Mailer Cron

on:
  schedule:
    # 15:30 UTC = 21:00 (9:00 PM) IST on Fridays & Saturdays (Dispatches on the week's last working day)
    - cron: '30 15 * * 5,6'
  workflow_dispatch:

jobs:
  send-weekly-mtd-report:
    name: Generate and Dispatch Weekly MTD Performance Emails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Execute Weekly MTD Performance Auto Mailer
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EMAIL_API_URL: 'https://varchaz-email-api-sigma.vercel.app/send'
          EMAIL_API_KEY: 'your_super_secret_api_key_here'
        run: node scripts/sendDailyReportCron.cjs --evening

